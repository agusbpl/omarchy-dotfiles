# ---------------------------------------------------------
# Hardware Submaps (Volume & Brightness)
# ---------------------------------------------------------
submap = Volume
# Speaker Volume (Output)
binde = , K, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
binde = , J, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
binde = , k, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
binde = , j, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , M, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , m, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Microphone Volume (Input) - Shift + J/K/M (Con OSD gráfico)
binde = SHIFT, K, exec, omarchy-swayosd-client --input-volume raise
binde = SHIFT, J, exec, omarchy-swayosd-client --input-volume lower
binde = SHIFT, k, exec, omarchy-swayosd-client --input-volume raise
binde = SHIFT, j, exec, omarchy-swayosd-client --input-volume lower
bind = SHIFT, M, exec, omarchy-swayosd-client --input-volume mute-toggle
bind = SHIFT, m, exec, omarchy-swayosd-client --input-volume mute-toggle

bind = , escape, submap, reset
bind = , RETURN, submap, reset
submap = reset

# Microphone Volume Global Media Keys (Shift + Subir/Bajar volumen con OSD)
binde = SHIFT, XF86AudioRaiseVolume, exec, omarchy-swayosd-client --input-volume raise
binde = SHIFT, XF86AudioLowerVolume, exec, omarchy-swayosd-client --input-volume lower



submap = Brightness
binde = , K, exec, bash -c 'if (( $(brightnessctl get) <= 4800 )); then brightnessctl set 1%+; else brightnessctl set 5%+; fi'
binde = , J, exec, bash -c 'if (( $(brightnessctl get) <= 4800 )); then brightnessctl set 1%-; else brightnessctl set 5%-; fi'
binde = , k, exec, bash -c 'if (( $(brightnessctl get) <= 4800 )); then brightnessctl set 1%+; else brightnessctl set 5%+; fi'
binde = , j, exec, bash -c 'if (( $(brightnessctl get) <= 4800 )); then brightnessctl set 1%-; else brightnessctl set 5%-; fi'
bind = , escape, submap, reset
bind = , RETURN, submap, reset
submap = reset

