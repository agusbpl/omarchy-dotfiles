<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qtile Keybindings Cheatsheet</title>
<style>
    :root {
        --bg-color: #1a1025;
        --card-bg: #2d1b3d;
        --text-main: #fde2e4;
        --text-muted: #c99cbd;
        --border-color: #4a2e5e;
        --kbd-bg: #3c2452;
        --kbd-border: #623f82;
        --kbd-text: #ffb86c;
        
        --accent-orange: #ff9e7d;
        --accent-magenta: #d85481;
        --accent-peach: #ffcc80;
        --accent-purple: #9d5cb8;
        --accent-pink: #ff7597;
    }

    * { box-sizing: border-box; }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        line-height: 1.5;
        margin: 0;
        padding: 2rem;
    }

    header {
        text-align: center;
        margin-bottom: 3rem;
    }

    header h1 {
        margin: 0;
        font-size: 2.5rem;
        font-weight: 800;
        color: var(--accent-orange);
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    header p {
        color: var(--text-muted);
        margin-top: 0.5rem;
        font-size: 1.1rem;
    }

    header p strong { color: var(--text-main); }

    .masonry-container {
        column-count: 3;
        column-gap: 1.5rem;
        max-width: 1400px;
        margin: 0 auto;
    }

    @media (max-width: 1200px) { .masonry-container { column-count: 2; } }
    @media (max-width: 768px) { .masonry-container { column-count: 1; } }

    .card {
        background: var(--card-bg);
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        border: 1px solid var(--border-color);
        break-inside: avoid;
        margin-bottom: 1.5rem;
        overflow: hidden;
        display: inline-block;
        width: 100%;
    }

    .card h3 {
        margin: 0;
        padding: 1rem 1.2rem;
        background: rgba(0, 0, 0, 0.2);
        border-bottom: 1px solid var(--border-color);
        font-size: 1.1rem;
        color: var(--text-main);
        letter-spacing: 0.5px;
    }

    .card.root h3 { border-top: 4px solid var(--accent-orange); }
    .card.office h3 { border-top: 4px solid var(--accent-magenta); }
    .card.docs h3 { border-top: 4px solid var(--accent-peach); }
    .card.code h3 { border-top: 4px solid var(--accent-purple); }
    .card.web h3 { border-top: 4px solid var(--accent-pink); }
    .card.ai h3 { border-top: 4px solid var(--accent-orange); }
    .card.unlp h3 { border-top: 4px solid var(--accent-magenta); }
    .card.system h3 { border-top: 4px solid var(--accent-peach); }

    .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.6rem 1.2rem;
        border-bottom: 1px solid var(--border-color);
        transition: background 0.15s ease;
    }

    .row:hover { background-color: rgba(255, 255, 255, 0.05); }
    .row:last-child { border-bottom: none; }

    .desc {
        font-size: 0.9rem;
        font-weight: 500;
        color: var(--text-main);
    }

    .keys {
        display: flex;
        gap: 0.3rem;
        align-items: center;
        color: var(--text-muted);
        font-size: 0.8rem;
    }

    kbd {
        background-color: var(--kbd-bg);
        border: 1px solid var(--kbd-border);
        border-radius: 4px;
        box-shadow: 0 2px 0 rgba(0,0,0,0.2);
        color: var(--kbd-text);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.75rem;
        font-weight: bold;
        padding: 0.2rem 0.5rem;
        white-space: nowrap;
        text-transform: capitalize;
    }

    .chord-seq {
        display: inline-block;
        margin: 0 0.5rem;
        color: var(--accent-peach);
        font-weight: bold;
        font-size: 0.95rem;
    }
</style>

<script src="./qtile_keys.js"></script>

</head>
<body>

<header>
    <h1>Qtile Cheatsheet</h1>
    <p><code>Mod</code> is <strong>Super</strong> | <code>Alt</code> is <strong>Mod1</strong></p>
</header>

<div class="masonry-container" id="masonry-container">
    </div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const container = document.getElementById("masonry-container");
        
        // Safety check if Qtile hasn't generated the file yet
        if (typeof qtileKeys === 'undefined') {
            container.innerHTML = "<h3 style='color: var(--accent-pink); text-align: center;'>Loading data... Please reload Qtile (Mod + Ctrl + R).</h3>";
            return;
        }

        // Formatting utilities for keys
        const formatKey = (k) => {
            const map = { 'mod4': 'Mod', 'mod1': 'Alt', 'control': 'Ctrl', 'shift': 'Shift', 'space': 'Space', 'return': 'Enter', 'Return': 'Enter' };
            return map[k] || k;
        };

        const createKeysHTML = (modifiers, key) => {
            const parts = [...modifiers, key].filter(Boolean).map(formatKey);
            return parts.map(p => `<kbd>${p}</kbd>`).join('+');
        };

        const createRow = (desc, mods, key) => {
            return `
            <div class="row">
                <div class="desc">${desc}</div>
                <div class="keys">${createKeysHTML(mods, key)}</div>
            </div>`;
        };

        // Theme mapping corresponding to your KeyChord names
        const classMap = {
            "Office": "office", "Programming": "code", "Learning": "docs", 
            "IA": "ai", "UNLP": "unlp", "NAV": "web", 
            "System": "system", "Volume": "system", "Brightness": "system", "TTS": "system"
        };

        let html = "";
        
        // 1. Process standard keys (Root Bindings)
        const rootKeys = qtileKeys.filter(k => k.type === "Key");
        if (rootKeys.length > 0) {
            html += `<div class="card root">
                        <h3>Window Management & Core</h3>
                        ${rootKeys.map(k => createRow(k.desc, k.modifiers, k.key)).join('')}
                     </div>`;
        }

        // 2. Process KeyChords
        const chords = qtileKeys.filter(k => k.type === "KeyChord");
        chords.forEach(chord => {
            const cssClass = classMap[chord.name] || "root";
            const trigger = createKeysHTML(chord.modifiers, chord.key);
            const subtitle = trigger ? `<span class="chord-seq">(${trigger}, then...)</span>` : '';
            
            html += `<div class="card ${cssClass}">
                        <h3>${chord.name} ${subtitle}</h3>
                        ${chord.submappings.map(k => createRow(k.desc, k.modifiers, k.key)).join('')}
                     </div>`;
        });

        // Inject generated HTML
        container.innerHTML = html;
    });
</script>

</body>
</html>
